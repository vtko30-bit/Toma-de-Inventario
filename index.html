<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Control de Inventario</title>
  <meta name="description" content="Aplicación multiusuario para control de inventario" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Inventario" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=138" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div id="auth-screen" class="auth-screen">
    <form id="auth-form" class="auth-card" autocomplete="on">
      <h2 id="auth-title">Iniciar sesión</h2>
      <p class="small" id="auth-mode-label"></p>
      <div id="auth-fields-register" style="display:none;">
        <label>Nombre completo<input id="auth-nombre" autocomplete="name" /></label>
        <label>Empresa<input id="auth-empresa" placeholder="Ej. Mi Negocio" autocomplete="organization" /></label>
      </div>
      <label>Correo<input type="email" id="auth-email" autocomplete="email" required /></label>
      <label>Contraseña<input type="password" id="auth-password" autocomplete="current-password" required minlength="6" /></label>
      <p id="auth-error" class="auth-error"></p>
      <div class="actions">
        <button type="submit" id="auth-submit">Entrar</button>
        <button type="button" id="auth-toggle" class="btn-link">Crear cuenta</button>
      </div>
      <div id="auth-google-wrap" class="auth-google-wrap" hidden>
        <div class="auth-divider" aria-hidden="true"><span>o</span></div>
        <button type="button" id="auth-google" class="btn-google">
          <svg class="btn-google-icon" viewBox="0 0 48 48" aria-hidden="true" width="18" height="18">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.5l.1-.1 6.3 5.3C39.2 37.3 44 32 44 24c0-1.3-.1-2.5-.4-3.5z"/>
          </svg>
          Continuar con Google
        </button>
      </div>
    </form>
  </div>

  <div id="toast-container"></div>

  <div id="app-shell" style="display:none;">
    <header class="topbar">
      <h1 class="topbar-title">Control de Inventario</h1>
      <div class="topbar-toolbar">
        <button type="button" id="btnNavMenu" class="btn-nav-menu" aria-expanded="false" aria-controls="sidebar">Menú</button>
        <div class="topbar-actions">
        <div class="dropdown" id="exportDropdown">
          <button id="btnExport" class="btn-topbar">Exportar</button>
          <div class="dropdown-menu" id="exportMenu">
            <button id="btnExportCsv">CSV</button>
            <button id="btnExportXlsx">Excel</button>
          </div>
        </div>
        <div class="dropdown" id="userDropdown">
          <button id="btnUser" class="btn-topbar">Usuario</button>
          <div class="dropdown-menu" id="userMenu">
            <span id="userInfo" class="user-info"></span>
            <button id="btnLogout">Cerrar sesión</button>
          </div>
        </div>
        </div>
      </div>
    </header>
    <div id="nav-backdrop" class="nav-backdrop" aria-hidden="true"></div>

    <main class="layout">
      <nav id="sidebar" class="sidebar">
        <button class="nav-btn active" data-view="inicio">Inicio</button>
        <button class="nav-btn" data-view="inventarios">Toma de Inventario</button>
        <button class="nav-btn" data-view="productos" data-hide-inventario-only="true">Productos</button>
        <button class="nav-btn" data-view="familias" data-admin-only="true">Familia</button>
        <button class="nav-btn" data-view="categorias" data-admin-only="true">Categoria</button>
        <button class="nav-btn" data-view="sucursales" data-admin-only="true">Sucursal</button>
        <button class="nav-btn" data-view="bodegas" data-admin-only="true">Bodega</button>
        <button class="nav-btn" data-view="movimientos" data-hide-inventario-only="true">Movimientos de mercaderías</button>
        <button class="nav-btn" data-view="usuarios" data-admin-only="true">Usuarios</button>
        <button class="nav-btn" data-view="dashboard" data-hide-inventario-only="true">Dashboard</button>
      </nav>

      <section class="content">
        <article id="view-inicio" class="view active"></article>
        <article id="view-dashboard" class="view"></article>
        <article id="view-productos" class="view"></article>
        <article id="view-recetas" class="view"></article>
        <article id="view-familias" class="view"></article>
        <article id="view-categorias" class="view"></article>
        <article id="view-sucursales" class="view"></article>
        <article id="view-bodegas" class="view"></article>
        <article id="view-movimientos" class="view"></article>
        <article id="view-inventarios" class="view"></article>
        <article id="view-usuarios" class="view"></article>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="supabase-config.js?v=138"></script>
  <script src="auth.js?v=138"></script>
  <script src="data.js?v=138"></script>
  <script src="app.js?v=138"></script>
</body>
</html>
